name: Build SecureChat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (inject bridge)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp app-bridge.js www/app-bridge.js
          sed -i 's#</body>#<script src="app-bridge.js"></script></body>#' www/index.html

      - name: Prepare icon
        run: |
          mkdir -p assets
          if [ ! -f icon.png ]; then echo "ERROR: icon.png repo ke root me rakho"; exit 1; fi
          cp icon.png assets/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Add native plugin (KeepAlive service)
        run: |
          D=android/app/src/main/java/com/securechat/app
          mkdir -p $D
          for f in KeepAlivePlugin.java KeepAliveService.java MainActivity.java; do
            if [ -f "$f" ]; then cp "$f" "$D/$f";
            elif [ -f "android-plugin/$f" ]; then cp "android-plugin/$f" "$D/$f";
            else echo "ERROR: $f repo me nahi mili (root me rakho)"; exit 1; fi
          done

      - name: Add permissions + service to manifest
        run: |
          python3 tools/patch_manifest.py android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Add notification status-bar icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp tools/ic_stat_securechat.png android/app/src/main/res/drawable/ic_stat_securechat.png

      - name: Generate icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#2338f0' --iconBackgroundColorDark '#2338f0'

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SecureChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
